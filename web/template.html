<title>מדריך הערוצים — עידן+</title>
<style>
  :root {
    --bg: #f2f4f4;
    --surface: #ffffff;
    --surface-2: #eaeeed;
    --border: #dde2e1;
    --text: #10181a;
    --text-dim: #5b6b69;
    --accent: #d94a1f;
    --accent-soft: rgba(217, 74, 31, .10);
    --ok: #1f9d6b;
    --ok-soft: rgba(31, 157, 107, .12);
    --danger: #c93b3b;
    --danger-soft: rgba(201, 59, 59, .12);
    --a11y: #6a4fc9;
    --a11y-soft: rgba(106, 79, 201, .12);
    --shadow: 0 1px 2px rgba(16, 24, 26, .06), 0 8px 24px -12px rgba(16, 24, 26, .18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1113; --surface: #171b1d; --surface-2: #1f2427; --border: #2a3033;
      --text: #eef1f0; --text-dim: #97a3a1; --accent: #ef5a2c; --accent-soft: rgba(239, 90, 44, .16);
      --ok: #34c98f; --ok-soft: rgba(52, 201, 143, .14);
      --danger: #ef4b4b; --danger-soft: rgba(239, 75, 75, .16);
      --a11y: #a48cf0; --a11y-soft: rgba(164, 140, 240, .18);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1113; --surface: #171b1d; --surface-2: #1f2427; --border: #2a3033;
    --text: #eef1f0; --text-dim: #97a3a1; --accent: #ef5a2c; --accent-soft: rgba(239, 90, 44, .16);
    --ok: #34c98f; --ok-soft: rgba(52, 201, 143, .14);
    --danger: #ef4b4b; --danger-soft: rgba(239, 75, 75, .16);
    --a11y: #a48cf0; --a11y-soft: rgba(164, 140, 240, .18);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -16px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f2f4f4; --surface: #ffffff; --surface-2: #eaeeed; --border: #dde2e1;
    --text: #10181a; --text-dim: #5b6b69; --accent: #d94a1f; --accent-soft: rgba(217, 74, 31, .10);
    --ok: #1f9d6b; --ok-soft: rgba(31, 157, 107, .12);
    --danger: #c93b3b; --danger-soft: rgba(201, 59, 59, .12);
    --a11y: #6a4fc9; --a11y-soft: rgba(106, 79, 201, .12);
    --shadow: 0 1px 2px rgba(16, 24, 26, .06), 0 8px 24px -12px rgba(16, 24, 26, .18);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Arial Hebrew", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .app { direction: rtl; max-width: 980px; margin: 0 auto; padding: 0 20px 120px; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 16px 0 14px; margin-bottom: 20px;
  }
  .titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft); display: inline-block; transform: translateY(-1px);
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .meta { font-size: 12px; color: var(--text-dim); }

  .pagetabs { display: flex; gap: 6px; margin-top: 14px; }
  .pagetab {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    border-radius: 10px; padding: 8px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .pagetab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .stat {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; font-size: 12.5px;
  }
  .stat b { font-family: ui-monospace, monospace; font-size: 13.5px; }
  .stat.ok b { color: var(--ok); }
  .stat.broken b { color: var(--danger); }

  .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1 1 200px; min-width: 160px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; color: var(--text);
  }
  .search::placeholder { color: var(--text-dim); }
  .search:focus, .chip:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .chipset { display: flex; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .spacer { flex: 1; }
  .savedbtn {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .savedbtn:hover { border-color: var(--accent); }
  .savedbtn .count {
    background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
    font-family: ui-monospace, monospace; padding: 0 5px;
  }
  .recbtn { border-color: var(--danger); color: var(--danger); }
  .recbtn .count { background: var(--danger); }
  .rec-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
    animation: recpulse 1.2s ease-in-out infinite;
  }
  @keyframes recpulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .rec-dot.is-pending { background: var(--accent); }

  .rec-banner {
    max-width: 980px; margin: 0 auto 14px; padding: 12px 16px; border-radius: 10px;
    background: var(--danger-soft); border: 1px solid var(--danger); color: var(--text);
    font-size: 13px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .rec-banner strong { color: var(--danger); }
  .rec-banner .rb-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto; }
  .rec-banner button {
    border: 1px solid var(--danger); background: var(--surface); color: var(--danger);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .rec-banner button:hover { background: var(--danger); color: #fff; }
  .rec-banner .rb-dismiss { border-color: var(--border); color: var(--text-dim); }
  .rec-banner .rb-dismiss:hover { background: var(--surface-2); color: var(--text); }

  .row-rec-dot { flex: none; }
  .rec-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 9px;
  }
  .rec-item:hover { background: var(--surface-2); }
  .rec-item .ri-name { flex: 1; font-size: 13.5px; font-weight: 600; }
  .rec-item .ri-time { font-size: 12px; color: var(--text-dim); }
  .rec-item .ri-stop {
    border: 1px solid var(--danger); background: var(--surface); color: var(--danger);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .rec-item .ri-stop:hover { background: var(--danger); color: #fff; }
  .player-rec-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    color: var(--danger); background: var(--danger-soft); border-radius: 999px; padding: 3px 9px;
    margin-inline-start: 8px;
  }

  .list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .empty { color: var(--text-dim); padding: 60px 0; text-align: center; font-size: 14px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; transition: border-color .15s, background .15s;
  }
  .row.is-selected { border-color: var(--accent); background: var(--accent-soft); }
  .row.is-broken { opacity: .6; }

  .pickbox {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; flex: none; appearance: none;
    display: grid; place-content: center;
  }
  .pickbox:checked { background: var(--accent); border-color: var(--accent); }
  .pickbox:checked::after {
    content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(35deg) translate(-1px, -1px);
  }
  .starbtn {
    background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 18px;
    line-height: 1; padding: 0; flex: none;
  }
  .starbtn.is-saved { color: var(--accent); }

  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row-name { font-weight: 700; font-size: 14.5px; }
  .row-name.is-broken-text { color: var(--danger); }
  .row-sub { font-size: 11.5px; color: var(--text-dim); min-height: 1.3em; }
  .row-sub .pulse {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim);
    margin-inline-end: 5px; animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .a11ybtn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    border-radius: 999px; padding: 5px 11px; font-size: 11.5px; font-weight: 700; cursor: pointer; flex: none;
  }
  .a11ybtn[aria-pressed="true"] { background: var(--a11y-soft); border-color: var(--a11y); color: var(--a11y); }

  .bulkbar {
    position: fixed; bottom: 18px; inset-inline: 0; display: flex; justify-content: center;
    pointer-events: none; z-index: 30;
  }
  .bulkbar-inner {
    pointer-events: auto; background: var(--text); color: var(--bg);
    border-radius: 14px; padding: 10px 12px 10px 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px; font-size: 13.5px;
    transform: translateY(140%); transition: transform .22s ease;
  }
  .bulkbar.is-visible .bulkbar-inner { transform: translateY(0); }
  .bulkbar button { border: none; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .bulkbar .save-action { background: var(--accent); color: #fff; }
  .bulkbar .clear-action { background: transparent; color: var(--bg); opacity: .7; }
  .bulkbar .clear-action:hover { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    display: none; align-items: flex-start; justify-content: center; padding: 8vh 16px;
  }
  .overlay.is-open { display: flex; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: min(480px, 100%); max-height: 78vh; display: flex; flex-direction: column;
    box-shadow: var(--shadow); direction: rtl;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 16px; margin: 0; }
  .panel-head button { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; }
  .panel-body { overflow-y: auto; padding: 8px 10px; }
  .panel-empty { color: var(--text-dim); text-align: center; padding: 40px 10px; font-size: 13.5px; }
  .panel-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 9px; }
  .panel-item:hover { background: var(--surface-2); }
  .panel-item .pi-name { flex: 1; font-size: 13.5px; font-weight: 600; }
  .panel-item .pi-page { font-size: 10.5px; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
  .panel-item .pi-remove { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px 6px; }
  .panel-item .pi-remove:hover { color: var(--danger); }
  .panel-foot { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .panel-foot button { flex: 1; border-radius: 9px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); }
  .panel-foot .export-json { background: var(--accent); color: #fff; border-color: var(--accent); }
  .panel-foot .export-m3u { background: var(--surface); color: var(--text); }
  .panel-foot button:disabled { opacity: .45; cursor: not-allowed; }

  .playbtn {
    background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 15px;
    line-height: 1; padding: 4px; flex: none; border-radius: 50%; display: grid; place-content: center;
    width: 26px; height: 26px;
  }
  .playbtn:hover { background: var(--accent-soft); color: var(--accent); }

  .player-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 4vh 16px;
  }
  .player-overlay.is-open { display: flex; }
  .player-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    width: min(880px, 100%); box-shadow: var(--shadow); direction: rtl; overflow: hidden;
  }
  .player-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .player-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .player-head button { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; }
  .player-video-wrap { position: relative; background: #000; aspect-ratio: 16 / 9; }
  .player-video-wrap:fullscreen, .player-video-wrap:-webkit-full-screen {
    aspect-ratio: auto; width: 100vw; height: 100vh;
  }
  .player-video-wrap video { width: 100%; height: 100%; display: block; background: #000; }
  .player-status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eee; font-size: 13.5px; text-align: center; padding: 24px; background: rgba(0,0,0,.55);
    pointer-events: none;
  }
  .player-status.is-hidden { display: none; }
  .player-osd {
    position: absolute; top: 14px; inset-inline-start: 14px; max-width: calc(100% - 28px);
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px); border-radius: 10px;
    padding: 8px 14px; color: #fff; opacity: 0; transform: translateY(-6px);
    transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .player-osd.is-shown { opacity: 1; transform: translateY(0); }
  .osd-name { font-size: 15px; font-weight: 800; text-wrap: balance; }
  .osd-program { font-size: 12px; opacity: .85; margin-top: 2px; }
  .player-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
  .player-foot .p-source { direction: ltr; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .player-legend {
    display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 16px 12px; font-size: 11.5px;
    color: var(--text-dim);
  }
  .player-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .player-legend kbd {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px;
    background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; color: var(--text);
  }
</style>

<div class="app" dir="rtl" lang="he">
  <header class="topbar">
    <div class="titlerow">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <h1>מדריך הערוצים — עידן+</h1>
      </div>
      <div class="meta">עודכן <span class="mono" id="generated-at" dir="ltr"></span></div>
    </div>

    <div class="pagetabs" role="tablist" aria-label="בחירת עמוד">
      <button class="pagetab" data-page="tv" role="tab">טלוויזיה</button>
      <button class="pagetab" data-page="radio" role="tab">רדיו</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <input class="search" id="search" type="search" placeholder="חיפוש ערוץ…" autocomplete="off" />
      <div class="chipset" id="status-filter" role="group" aria-label="סינון לפי סטטוס"></div>
      <div class="spacer"></div>
      <button class="savedbtn recbtn" id="open-recordings" hidden>
        <span class="rec-dot" aria-hidden="true"></span>
        <span id="rec-label">מקליט</span>
        <span class="count mono" id="rec-count">0</span>
      </button>
      <button class="savedbtn" id="open-saved">
        <span>★ שמורים</span>
        <span class="count mono" id="saved-count">0</span>
      </button>
    </div>
  </header>

  <div class="rec-banner" id="rec-banner" hidden></div>

  <main class="list" id="list"></main>
  <div class="empty" id="empty-state" hidden>לא נמצאו ערוצים תואמים.</div>

  <div class="bulkbar" id="bulkbar">
    <div class="bulkbar-inner">
      <span><b class="mono" id="bulk-count">0</b> ערוצים נבחרו</span>
      <button class="save-action" id="bulk-save">★ שמור נבחרים</button>
      <button class="clear-action" id="bulk-clear">נקה בחירה</button>
    </div>
  </div>

  <div class="overlay" id="saved-overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-label="ערוצים שמורים">
      <div class="panel-head">
        <h2>ערוצים שמורים (<span class="mono" id="panel-count">0</span>)</h2>
        <button id="close-saved" aria-label="סגור">✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-foot">
        <button class="export-json" id="export-json" disabled>⬇ ייצוא JSON</button>
        <button class="export-m3u" id="export-m3u" disabled>⬇ ייצוא M3U</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="recordings-overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-label="הקלטות פעילות">
      <div class="panel-head">
        <h2>הקלטות פעילות (<span class="mono" id="rec-panel-count">0</span>)</h2>
        <button id="close-recordings" aria-label="סגור">✕</button>
      </div>
      <div class="panel-body" id="rec-panel-body"></div>
    </div>
  </div>

  <div class="player-overlay" id="player-overlay">
    <div class="player-panel" role="dialog" aria-modal="true" aria-label="נגן">
      <div class="player-head">
        <span style="display:flex;align-items:center;overflow:hidden">
          <h2 id="player-title"></h2>
          <span class="player-rec-badge" id="player-rec-badge" hidden><span class="rec-dot" aria-hidden="true"></span>מקליט</span>
        </span>
        <button id="close-player" aria-label="סגור">✕</button>
      </div>
      <div class="player-video-wrap">
        <video id="player-video" playsinline controls></video>
        <div class="player-status" id="player-status"></div>
        <div class="player-osd" id="player-osd">
          <div class="osd-name" id="osd-name"></div>
          <div class="osd-program" id="osd-program"></div>
        </div>
      </div>
      <div class="player-foot">
        <span id="player-source-label"></span>
        <span class="mono p-source" id="player-source" dir="ltr"></span>
      </div>
      <div class="player-legend" dir="ltr">
        <span><kbd>↑</kbd><kbd>↓</kbd> ערוצים מומלצים</span>
        <span><kbd>Ctrl</kbd>+<kbd>↑</kbd><kbd>↓</kbd> מועדפים ★</span>
        <span><kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd> כל הערוצים</span>
        <span><kbd>R</kbd> הקלטה</span>
        <span><kbd>P</kbd> השהיה</span>
        <span><kbd>M</kbd> השתקה</span>
        <span><kbd>Enter</kbd> מסך מלא</span>
        <span><kbd>Esc</kbd> סגירה</span>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="channel-data">__CHANNEL_DATA_JSON__</script>
<script>__HLS_JS__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("channel-data").textContent);
  var PAGES = { tv: DATA.tv, radio: DATA.radio };
  var PAGE_LABEL = { tv: "טלוויזיה", radio: "רדיו" };

  var LS_SAVED = "idanplus.saved.v1";
  var LS_A11Y = "idanplus.accessibility.v1";
  var LS_PAGE = "idanplus.lastPage.v1";
  var LS_UI = "idanplus.ui.v1";

  function lsGet(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  var saved = lsGet(LS_SAVED, { tv: [], radio: [] });
  var a11yOn = lsGet(LS_A11Y, { tv: [], radio: [] });
  var ui = lsGet(LS_UI, {
    tv: { filter: "ok", search: "" },
    radio: { filter: "ok", search: "" }
  });

  var state = {
    page: lsGet(LS_PAGE, "tv"),
    selected: new Set(),
    smartPicks: {}   // groupKey -> { candidateId, label, testing }
  };
  if (state.page !== "tv" && state.page !== "radio") state.page = "tv";

  function fmtGeneratedAt(iso) {
    try {
      var d = new Date(iso.replace(" ", "T"));
      return d.toLocaleString("he-IL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }
  document.getElementById("generated-at").textContent = fmtGeneratedAt(DATA.generatedAt);

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function groups() { return PAGES[state.page]; }
  function pageUi() { return ui[state.page]; }

  function candidatesOf(group) {
    var list = [{ id: group.primary.channel_id, label: "ראשי", link: group.primary.resolved_link, status: group.primary.status, refresh: group.primary.refresh }];
    group.backups.forEach(function (b) {
      list.push({ id: b.channel_id, label: "גיבוי" + (b.backupN > 1 ? " " + b.backupN : ""), link: b.resolved_link, status: b.status, refresh: b.refresh });
    });
    return list.filter(function (c) { return c.status === "ok" || c.status === "updated"; });
  }

  // Some sources (mako/keshet) bake a short-lived auth ticket (~15 min) into
  // the link at data-generation time - fine for the latency probe below, but
  // stale by the time someone actually presses play later. Those candidates
  // carry a `refresh` descriptor so the player can ask the source for a
  // brand new ticket right before playing, instead of trusting the one baked
  // in at build time. Falls back to the baked link if the live refresh fails
  // (offline, endpoint down, etc.) - stale is still better than nothing.
  function freshenLink(candidate) {
    var r = candidate.refresh;
    if (!r || r.kind !== "keshet") return Promise.resolve(candidate.link);
    var url = "https://mass.mako.co.il/ClicksStatistics/entitlementsServicesV2.jsp?"
      + new URLSearchParams({ et: "ngt", lp: r.path, rv: r.cdn });
    return fetch(url).then(function (res) { return res.json(); }).then(function (result) {
      if (result.caseId !== "1" || !result.tickets || !result.tickets[0]) throw new Error("entitlements refused");
      var ticket = result.tickets[0].ticket;
      var sep = r.path.indexOf("?") !== -1 ? "&" : "?";
      return r.host + r.path + sep + ticket;
    }).catch(function () { return candidate.link; });
  }

  function activeLink(group) {
    var isA11y = a11yOn[state.page].indexOf(group.key) !== -1;
    if (isA11y && group.accessibility && group.accessibility.resolved_link) {
      return group.accessibility.resolved_link;
    }
    var pick = state.smartPicks[group.key];
    if (pick && pick.link) return pick.link;
    var candidates = candidatesOf(group);
    return candidates.length ? candidates[0].link : (group.primary.resolved_link || null);
  }

  // ---------- latency-based "smart" stream selection ----------
  function probeLatency(url, timeoutMs) {
    return new Promise(function (resolve) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, timeoutMs);
      var t0 = performance.now();
      fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal })
        .then(function () { clearTimeout(timer); resolve(performance.now() - t0); })
        .catch(function () { clearTimeout(timer); resolve(null); });
    });
  }

  function runSmartSelect(group) {
    var candidates = candidatesOf(group);
    if (candidates.length <= 1) return; // nothing to race
    state.smartPicks[group.key] = { testing: true };
    renderRow(group);
    Promise.all(candidates.map(function (c) { return probeLatency(c.link, 4000); }))
      .then(function (timings) {
        var best = null, bestMs = Infinity;
        timings.forEach(function (ms, i) {
          if (ms !== null && ms < bestMs) { bestMs = ms; best = candidates[i]; }
        });
        best = best || candidates[0];
        state.smartPicks[group.key] = { candidateId: best.id, label: best.label, link: best.link, ms: Math.round(bestMs === Infinity ? 0 : bestMs), testing: false };
        renderRow(group);
      });
  }

  // ---------- rendering ----------
  function renderPageTabs() {
    var tabs = document.querySelectorAll(".pagetab");
    Array.prototype.forEach.call(tabs, function (btn) {
      btn.setAttribute("aria-selected", btn.getAttribute("data-page") === state.page);
      btn.onclick = function () {
        state.page = btn.getAttribute("data-page");
        lsSet(LS_PAGE, state.page);
        state.selected.clear();
        closePlayer();
        fullRender();
      };
    });
  }

  function renderStats() {
    var counts = { ok: 0, broken: 0 };
    groups().forEach(function (g) { counts[g.status] = (counts[g.status] || 0) + 1; });
    document.getElementById("stats").innerHTML =
      statTile("ok", counts.ok || 0, "תקינים") +
      statTile("broken", counts.broken || 0, "לא זמינים");
  }
  function statTile(cls, n, label) {
    return '<div class="stat ' + cls + '"><b class="mono">' + n + "</b><span>" + label + "</span></div>";
  }

  var STATUS_FILTERS = [
    { key: "ok", label: "תקינים" },
    { key: "all", label: "הכל" },
    { key: "broken", label: "לא זמינים" }
  ];
  function renderFilters() {
    var el = document.getElementById("status-filter");
    el.innerHTML = STATUS_FILTERS.map(function (f) {
      return '<button class="chip" data-key="' + f.key + '" aria-pressed="' + (pageUi().filter === f.key) + '">' + f.label + "</button>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".chip"), function (btn) {
      btn.onclick = function () {
        pageUi().filter = btn.getAttribute("data-key");
        lsSet(LS_UI, ui);
        renderFilters();
        renderList();
      };
    });
  }

  function matches(g) {
    var f = pageUi().filter;
    if (f !== "all" && g.status !== f) return false;
    var q = (pageUi().search || "").trim().toLowerCase();
    if (q) return g.name.toLowerCase().indexOf(q) !== -1;
    return true;
  }

  function rowSubHtml(group) {
    if (group.status === "broken") return '<span style="color:var(--danger)">לא נמצא מקור זמין</span>';
    var isA11y = a11yOn[state.page].indexOf(group.key) !== -1;
    if (isA11y) return "מוצג ערוץ לקויי שמיעה";
    var pick = state.smartPicks[group.key];
    var candidates = candidatesOf(group);
    if (candidates.length <= 1) return "";
    if (!pick || pick.testing) return '<span class="pulse"></span>בודק מקור מהיר ביותר…';
    return "נבחר אוטומטית: " + escapeHtml(pick.label) + (pick.ms ? " (" + pick.ms + "ms)" : "");
  }

  function rowHtml(group) {
    var id = state.page + "::" + group.key;
    var isSel = state.selected.has(id);
    var isSaved = saved[state.page].indexOf(group.key) !== -1;
    var isBroken = group.status === "broken";
    var hasA11y = !!(group.accessibility && group.accessibility.resolved_link);
    var isA11yOn = a11yOn[state.page].indexOf(group.key) !== -1;
    return (
      '<div class="row' + (isSel ? " is-selected" : "") + (isBroken ? " is-broken" : "") + '" data-key="' + escapeHtml(group.key) + '">' +
        '<input type="checkbox" class="pickbox" aria-label="בחר את ' + escapeHtml(group.name) + '"' + (isSel ? " checked" : "") + (isBroken ? " disabled" : "") + " />" +
        '<button class="starbtn' + (isSaved ? " is-saved" : "") + '" aria-label="שמור" aria-pressed="' + isSaved + '">' + (isSaved ? "★" : "☆") + "</button>" +
        '<button class="playbtn" aria-label="נגן את ' + escapeHtml(group.name) + '"' + (isBroken ? " disabled" : "") + ">▶</button>" +
        '<div class="row-main">' +
          '<div class="row-name' + (isBroken ? " is-broken-text" : "") + '">' + escapeHtml(group.name) + "</div>" +
          '<div class="row-sub" data-role="sub">' + rowSubHtml(group) + "</div>" +
        "</div>" +
        (hasA11y ? '<button class="a11ybtn" aria-pressed="' + isA11yOn + '">ליקוי שמיעה</button>' : "") +
      "</div>"
    );
  }

  function renderRow(group) {
    var row = document.querySelector('.row[data-key="' + CSS.escape(group.key) + '"]');
    if (!row) return;
    var sub = row.querySelector('[data-role="sub"]');
    if (sub) sub.innerHTML = rowSubHtml(group);
  }

  function renderList() {
    var visible = groups().filter(matches);
    var list = document.getElementById("list");
    var emptyState = document.getElementById("empty-state");
    if (!visible.length) {
      list.innerHTML = "";
      emptyState.hidden = false;
    } else {
      emptyState.hidden = true;
      list.innerHTML = visible.map(rowHtml).join("");
    }
    Array.prototype.forEach.call(list.querySelectorAll(".row"), function (row) {
      var key = row.getAttribute("data-key");
      var group = groups().filter(function (g) { return g.key === key; })[0];
      var pick = row.querySelector(".pickbox");
      if (pick) pick.addEventListener("change", function (e) { toggleSelect(group, e.target.checked); });
      var star = row.querySelector(".starbtn");
      star.addEventListener("click", function () { toggleSaved(group); });
      var a11y = row.querySelector(".a11ybtn");
      if (a11y) a11y.addEventListener("click", function () { toggleA11y(group); });
      var play = row.querySelector(".playbtn");
      if (play) play.addEventListener("click", function () { openPlayer(group); });
    });
    updateBulkBar();
    updateRecUI();
    visible.forEach(function (g) {
      if (g.status !== "broken" && !state.smartPicks[g.key] && a11yOn[state.page].indexOf(g.key) === -1) {
        runSmartSelect(g);
      }
    });
  }

  function toggleSelect(group, on) {
    var id = state.page + "::" + group.key;
    if (on) state.selected.add(id); else state.selected.delete(id);
    var row = document.querySelector('.row[data-key="' + CSS.escape(group.key) + '"]');
    if (row) row.classList.toggle("is-selected", on);
    updateBulkBar();
  }

  function toggleSaved(group) {
    var list = saved[state.page];
    var idx = list.indexOf(group.key);
    if (idx === -1) list.push(group.key); else list.splice(idx, 1);
    lsSet(LS_SAVED, saved);
    var row = document.querySelector('.row[data-key="' + CSS.escape(group.key) + '"]');
    if (row) {
      var isSaved = list.indexOf(group.key) !== -1;
      var btn = row.querySelector(".starbtn");
      btn.classList.toggle("is-saved", isSaved);
      btn.textContent = isSaved ? "★" : "☆";
      btn.setAttribute("aria-pressed", isSaved);
    }
    updateSavedCount();
    if (document.getElementById("saved-overlay").classList.contains("is-open")) renderSavedPanel();
  }

  function toggleA11y(group) {
    var list = a11yOn[state.page];
    var idx = list.indexOf(group.key);
    if (idx === -1) list.push(group.key); else list.splice(idx, 1);
    lsSet(LS_A11Y, a11yOn);
    var row = document.querySelector('.row[data-key="' + CSS.escape(group.key) + '"]');
    if (row) {
      var isOn = list.indexOf(group.key) !== -1;
      var btn = row.querySelector(".a11ybtn");
      btn.setAttribute("aria-pressed", isOn);
      renderRow(group);
    }
  }

  // ---------- player ----------
  var playerOverlay = document.getElementById("player-overlay");
  var playerVideo = document.getElementById("player-video");
  var playerStatus = document.getElementById("player-status");
  var currentHls = null;
  var playerCandidates = [];
  var playerAttempt = 0;

  function playerCandidatesFor(group) {
    var isA11y = a11yOn[state.page].indexOf(group.key) !== -1;
    if (isA11y && group.accessibility && group.accessibility.resolved_link) {
      return [{ label: "לקויי שמיעה", link: group.accessibility.resolved_link, refresh: group.accessibility.refresh }];
    }
    // Smart pick first (if one was already chosen), then the rest of the
    // candidates in order - so a failed stream falls through to the next
    // best guess instead of just giving up.
    var all = candidatesOf(group);
    var pick = state.smartPicks[group.key];
    if (pick && pick.candidateId) {
      all = all.slice().sort(function (a) { return a.id === pick.candidateId ? -1 : 0; });
    }
    return all;
  }

  function setPlayerStatus(text) {
    if (text) { playerStatus.textContent = text; playerStatus.classList.remove("is-hidden"); }
    else { playerStatus.classList.add("is-hidden"); }
  }

  function teardownPlayer() {
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    playerVideo.removeAttribute("src");
    playerVideo.load();
  }

  function playCandidate() {
    if (playerAttempt >= playerCandidates.length) {
      setPlayerStatus("לא ניתן להפעיל אף אחד מהמקורות הזמינים כרגע. נסו לרענן את העמוד או לבחור ערוץ אחר.");
      return;
    }
    var candidate = playerCandidates[playerAttempt];
    var myAttempt = playerAttempt; // guards against a stale fetch resolving after tryNext()/close already moved on
    document.getElementById("player-source-label").textContent = "מקור:";
    document.getElementById("player-source").textContent = candidate.label + (playerCandidates.length > 1 ? " (" + (playerAttempt + 1) + "/" + playerCandidates.length + ")" : "");
    setPlayerStatus(candidate.refresh ? "מרענן הרשאת שידור…" : "טוען שידור…");
    teardownPlayer();

    var tryNext = function () {
      if (playerAttempt !== myAttempt) return;
      playerAttempt += 1;
      playCandidate();
    };

    freshenLink(candidate).then(function (freshUrl) {
      if (playerAttempt !== myAttempt || !playerOverlay.classList.contains("is-open")) return;
      setPlayerStatus("טוען שידור…");
      startPlayback(freshUrl, tryNext);
    });
  }

  /**
   * Wires one <video> element to one HLS source, generic enough to serve
   * both the visible player and a hidden background recording. `onLevel` is
   * called on every hls.js quality-level switch (used by the recording
   * quality monitor below) - undefined/no-op for the visible player, which
   * doesn't need it.
   * Returns the Hls instance (so the caller can destroy() it later), or
   * `null` for native HLS (nothing to tear down beyond the <video> itself),
   * or `undefined` if this browser can play neither.
   */
  function attachStream(videoEl, link, onReady, onFatal, onLevel) {
    if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
      videoEl.src = link;
      videoEl.addEventListener("loadedmetadata", function once() {
        videoEl.removeEventListener("loadedmetadata", once); onReady();
      });
      videoEl.addEventListener("error", function once() {
        videoEl.removeEventListener("error", once); onFatal();
      }, { once: true });
      videoEl.play().catch(function () {});
      return null;
    }
    if (window.Hls && window.Hls.isSupported()) {
      var hls = new window.Hls({ maxBufferLength: 20 });
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
        onReady();
        videoEl.play().catch(function () {});
      });
      hls.on(window.Hls.Events.ERROR, function (event, data) {
        if (data.fatal) onFatal();
      });
      if (onLevel) hls.on(window.Hls.Events.LEVEL_SWITCHED, function (event, data) { onLevel(data.level); });
      hls.loadSource(link);
      hls.attachMedia(videoEl);
      return hls;
    }
    return undefined;
  }

  function startPlayback(link, tryNext) {
    var hls = attachStream(
      playerVideo, link,
      function onReady() { setPlayerStatus(""); },
      tryNext
    );
    if (hls === undefined) { setPlayerStatus("הדפדפן הזה אינו תומך בניגון שידורי HLS."); return; }
    currentHls = hls;
  }

  var playingKey = null;
  var osdTimer = null;
  var osdEl = document.getElementById("player-osd");

  // Channel-surf OSD, the classic remote-control "you're now on Channel X"
  // banner - shows briefly on every channel change (open or ↑/↓), then fades.
  function showOsd(group) {
    document.getElementById("osd-name").textContent = group.name;
    var program = group.primary && group.primary.now_playing;
    document.getElementById("osd-program").textContent = program || "";
    document.getElementById("osd-program").hidden = !program;
    osdEl.classList.add("is-shown");
    clearTimeout(osdTimer);
    osdTimer = setTimeout(function () { osdEl.classList.remove("is-shown"); }, 3200);
  }

  function openPlayer(group) {
    playingKey = group.key;
    document.getElementById("player-title").textContent = group.name;
    updateRecIndicatorInModal();
    showOsd(group);
    playerCandidates = playerCandidatesFor(group);
    playerAttempt = 0;
    playerOverlay.classList.add("is-open");
    if (!playerCandidates.length) {
      setPlayerStatus("אין מקור זמין לערוץ הזה כרגע.");
      return;
    }
    playCandidate();
  }

  function closePlayer() {
    playingKey = null;
    playerOverlay.classList.remove("is-open");
    teardownPlayer();
  }

  // Three ↑/↓ surfing modes, cheapest/most-curated first:
  //  plain      - a short curated "favorites" order (the channels most
  //               people actually flip between - main broadcast numbers,
  //               not every regional/backup variant on the full list).
  //  Ctrl+↑/↓   - only your ★ שמורים (saved) channels, in the order you
  //               saved them.
  //  Shift+↑/↓  - bypasses both and walks the ENTIRE currently visible
  //               (filtered/searched) list, in on-screen order - the
  //               escape hatch to reach anything not in the other two.
  // Radio has no curated order defined, so plain arrows there fall back to
  // the full-list mode.
  var CURATED_ORDER = {
    tv: ["כאן 11", "קשת 12", "רשת 13", "כאן חינוכית 23", "מכאן 33", "כנסת 99", "ערוץ 9", "עכשיו 14", "ערוץ 16"],
  };

  function switchChannel(delta, mode) {
    var playable = groups().filter(matches).filter(function (g) { return g.status !== "broken"; });
    var list = playable;
    if (mode === "saved") {
      var byKey = {};
      playable.forEach(function (g) { byKey[g.key] = g; });
      list = saved[state.page].map(function (key) { return byKey[key]; }).filter(Boolean);
    } else if (mode === "curated" && CURATED_ORDER[state.page]) {
      var byName = {};
      playable.forEach(function (g) { byName[g.name] = g; });
      list = CURATED_ORDER[state.page].map(function (name) { return byName[name]; }).filter(Boolean);
    }
    if (!list.length) return;
    var idx = list.findIndex(function (g) { return g.key === playingKey; });
    var next = idx === -1 ? 0 : (idx + delta + list.length) % list.length;
    openPlayer(list[next]);
  }

  document.getElementById("close-player").addEventListener("click", closePlayer);
  playerOverlay.addEventListener("click", function (e) { if (e.target === playerOverlay) closePlayer(); });
  document.addEventListener("keydown", function (e) {
    if (!playerOverlay.classList.contains("is-open")) return;
    if (e.key === "Escape") { closePlayer(); return; }
    // Ignore arrows while a text field has focus (e.g. the search box) so
    // they still move the caret/selection there as expected.
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    var navMode = e.shiftKey ? "full" : (e.ctrlKey || e.metaKey) ? "saved" : "curated";
    if (e.key === "ArrowDown") { e.preventDefault(); switchChannel(1, navMode); }
    else if (e.key === "ArrowUp") { e.preventDefault(); switchChannel(-1, navMode); }
    else if (e.key === "r" || e.key === "R") { e.preventDefault(); toggleRecordingCurrent(); }
    else if (e.key === "Enter") { e.preventDefault(); toggleFullscreen(); }
    else if (e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); }
    else if (e.key === "m" || e.key === "M") { e.preventDefault(); playerVideo.muted = !playerVideo.muted; }
  });

  function togglePause() {
    if (playerVideo.paused) playerVideo.play().catch(function () {});
    else playerVideo.pause();
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var wrap = playerVideo.closest(".player-video-wrap");
    (wrap.requestFullscreen ? wrap : playerVideo).requestFullscreen().catch(function () {});
  }

  // A bigger screen deserves better quality than whatever ABR had settled on
  // for the small windowed view - but "better" means the highest level that
  // still FITS the actual screen, not unconditionally the top level: a 1080p
  // display gains nothing from a 4K stream, just wasted bandwidth (and a
  // recording running in the background would feel that waste directly).
  // Hands control back to automatic ABR on exit. Native Safari HLS has no
  // public API for this, so this only does anything when hls.js is driving.
  document.addEventListener("fullscreenchange", function () {
    if (!currentHls || !currentHls.levels || !currentHls.levels.length) return;
    if (document.fullscreenElement) {
      var screenHeight = (window.screen.height || 1080) * (window.devicePixelRatio || 1);
      var levels = currentHls.levels.map(function (lvl, i) { return { i: i, h: lvl.height || 0 }; });
      var fitting = levels.filter(function (l) { return l.h > 0 && l.h <= screenHeight; });
      var pool = fitting.length ? fitting : levels; // nothing fits (tiny levels only) - just take the best available
      var best = pool.reduce(function (a, b) { return b.h > a.h ? b : a; });
      currentHls.currentLevel = best.i;
    } else {
      currentHls.currentLevel = -1; // back to automatic ABR
    }
  });

  // ---------- recording ----------
  // Records what's actually decoded and rendered by a hidden <video>, via
  // HTMLMediaElement.captureStream() + MediaRecorder - not a raw download of
  // the HLS segments. That's the only thing that works generically across
  // every provider here without a server: some CDNs require a session
  // ticket per segment (keshet), others need a specific Referer, and none of
  // that machinery has to be reimplemented if we just record what the
  // player itself is already successfully playing.
  var recordings = {}; // id ("page::key") -> { page, group, video, hls, recorder, chunks, startedAt, stalls: [], downgrades: [], mimeType }
  var recBanner = document.getElementById("rec-banner");
  var recBannerDismissedAt = 0;

  function recId(page, key) { return page + "::" + key; }
  function activeRecordingCount() { return Object.keys(recordings).length; }

  function recordingSupport() {
    var v = document.createElement("video");
    if (!window.MediaRecorder || !v.captureStream) {
      return "הדפדפן הזה אינו תומך בהקלטה מהדפדפן (חסר MediaRecorder/captureStream).";
    }
    return null;
  }

  function pickMimeType() {
    var options = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    for (var i = 0; i < options.length; i += 1) {
      if (window.MediaRecorder.isTypeSupported(options[i])) return options[i];
    }
    return "";
  }

  function sanitizeFilename(s) {
    return String(s).replace(/[\\/:*?"<>|]/g, "_").slice(0, 120);
  }

  function candidatesForPage(page, group) {
    var prevPage = state.page;
    state.page = page;
    var list = playerCandidatesFor(group);
    state.page = prevPage;
    return list;
  }

  function toggleRecordingCurrent() {
    if (!playingKey) return;
    var group = groups().filter(function (g) { return g.key === playingKey; })[0];
    if (!group) return;
    var id = recId(state.page, group.key);
    if (recordings[id]) stopRecording(id);
    else startRecording(state.page, group);
  }

  function startRecording(page, group) {
    var id = recId(page, group.key);
    if (recordings[id]) return;
    var unsupported = recordingSupport();
    if (unsupported) { alert(unsupported); return; }

    var candidates = candidatesForPage(page, group);
    if (!candidates.length) { alert("אין מקור זמין להקלטה עבור " + group.name + "."); return; }

    var video = document.createElement("video");
    // volume=0 instead of muted=true: some browsers (Firefox in particular
    // has had bugs here) drop the audio track from captureStream() entirely
    // when the element is muted, even though decoding itself continues.
    // volume=0 keeps the audio pipeline "live" while just not sending sound
    // to speakers. Positioned off-screen at REAL size rather than
    // opacity:0/1px - some browsers throttle or skip decoding frames for
    // video that's effectively invisible (0 opacity, 0 area), which would
    // make captureStream() produce nothing despite the element otherwise
    // looking like it's playing fine.
    video.volume = 0; video.playsInline = true;
    video.style.cssText = "position:fixed;left:-10000px;top:0;width:320px;height:180px;pointer-events:none";
    document.body.appendChild(video);

    var rec = {
      page: page, group: group, video: video, hls: null, recorder: null, chunks: [],
      startedAt: Date.now(), stalls: [], downgrades: [], mimeType: pickMimeType(), confirmed: false,
    };
    recordings[id] = rec;
    updateRecUI(); // shows as "starting…" (see rowSubHtml/renderRecordingsPanel) until confirmed below

    var attempt = 0;
    function tryNext() {
      attempt += 1;
      if (attempt >= candidates.length) {
        alert("לא הצלחנו להתחיל הקלטה עבור " + group.name + " — אף מקור לא נטען בהצלחה.");
        stopRecording(id, /* download = */ false);
        return;
      }
      load();
    }
    function load() {
      freshenLink(candidates[attempt]).then(function (link) {
        if (!recordings[id]) return; // stopped/cancelled meanwhile
        if (rec.hls) { rec.hls.destroy(); rec.hls = null; }
        rec.hls = attachStream(video, link, onReady, tryNext, function onLevel(level) {
          rec.downgrades.push({ t: Date.now(), level: level });
          checkQuality();
        }) || null;
      });
    }
    function onReady() {
      if (!recordings[id] || rec.recorder) return; // already started, or stopped meanwhile
      startCapture();
    }
    video.addEventListener("waiting", function () {
      rec.stalls.push(Date.now());
      checkQuality();
    });
    load();

    function startCapture() {
      if (!video.captureStream && !video.mozCaptureStream) {
        alert("הדפדפן הזה לא תומך ב-captureStream, ולכן אי אפשר להקליט בו.");
        stopRecording(id, false);
        return;
      }
      var stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
      var recorder;
      try {
        recorder = new MediaRecorder(stream, rec.mimeType ? { mimeType: rec.mimeType } : undefined);
      } catch (ex) {
        alert("לא ניתן להתחיל הקלטה: " + ex.message);
        stopRecording(id, false);
        return;
      }
      recorder.ondataavailable = function (e) {
        if (!e.data || !e.data.size) return;
        rec.chunks.push(e.data);
        if (!rec.confirmed) { rec.confirmed = true; updateRecUI(); } // first real bytes - genuinely recording now
      };
      recorder.onerror = function (e) {
        alert("שגיאה בהקלטת " + group.name + ": " + (e.error && e.error.message ? e.error.message : "שגיאה לא ידועה"));
        stopRecording(id, rec.chunks.length > 0);
      };
      recorder.start(1000);
      rec.recorder = recorder;
      updateRecUI();

      // Watchdog: if the recorder never produces a single real chunk within
      // 10s, something is silently broken (captureStream returning an empty
      // stream is the known failure mode) - surface that instead of leaving
      // a "recording" indicator running over nothing, forever.
      setTimeout(function () {
        if (recordings[id] && !rec.confirmed) {
          alert(
            "ההקלטה של " + group.name + " לא הניבה נתונים ונעצרה. " +
            "ייתכן שהדפדפן הזה חוסם הקלטה ממקור הווידאו הזה (captureStream ריק) - נסו דפדפן אחר."
          );
          stopRecording(id, false);
        }
      }, 10000);
    }
  }

  function stopRecording(id, download) {
    var rec = recordings[id];
    if (!rec) return;
    delete recordings[id];

    var finished = false;
    var finish = function () {
      if (finished) return; // guards against both the real onstop AND the fallback timeout below firing
      finished = true;
      if (download !== false) {
        if (rec.chunks.length) {
          var blob = new Blob(rec.chunks, { type: rec.mimeType || "video/webm" });
          var now = new Date();
          var dateStr = now.toLocaleDateString("he-IL").replace(/\./g, "-");
          var timeStr = now.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }).replace(":", "");
          var program = rec.group.primary && rec.group.primary.now_playing;
          var name = sanitizeFilename(
            rec.group.name + (program ? " - " + program : "") + " - " + dateStr + " " + timeStr
          ) + ".webm";
          downloadBlob(blob, name, rec.mimeType || "video/webm");
        } else {
          // Explicit rather than silent: an empty recording (stopped before
          // any real data came in, or the underlying stream never actually
          // produced frames - the captureStream failure mode from before)
          // used to just do nothing here with no explanation.
          alert("ההקלטה של " + rec.group.name + " נעצרה, אך לא נאספו נתונים - לא נשמר קובץ.");
        }
      }
      if (rec.hls) rec.hls.destroy();
      rec.video.pause();
      rec.video.remove();
      updateRecUI();
    };

    if (rec.recorder && rec.recorder.state !== "inactive") {
      rec.recorder.onstop = finish;
      try {
        rec.recorder.stop();
      } catch (ex) {
        finish(); // stop() itself threw - clean up immediately rather than leave the indicator stuck
      }
      // Belt and suspenders: if the browser never fires onstop (seen in the
      // wild when the underlying MediaStream's track has already died),
      // force cleanup anyway - "stop doesn't work" should never mean the
      // recording indicator is stuck forever.
      setTimeout(finish, 4000);
    } else {
      finish();
    }
  }

  function elapsedLabel(startedAt) {
    var s = Math.floor((Date.now() - startedAt) / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return (h ? h + ":" : "") + pad(m) + ":" + pad(sec);
  }

  function updateRecIndicatorInModal() {
    var id = recId(state.page, playingKey);
    document.getElementById("player-rec-badge").hidden = !recordings[id];
  }

  function updateRecUI() {
    var n = activeRecordingCount();
    var btn = document.getElementById("open-recordings");
    btn.hidden = n === 0;
    document.getElementById("rec-count").textContent = n;
    var names = Object.keys(recordings).map(function (id) { return recordings[id].group.name; });
    // Names right on the button when there's room for them (1-2 recordings);
    // beyond that it'd overflow the header, so fall back to a plain count -
    // the full list is always in the title tooltip and in the panel either way.
    document.getElementById("rec-label").textContent = names.length && names.length <= 2 ? names.join(", ") : "מקליט";
    btn.title = names.length ? "מקליט כעת: " + names.join(", ") : "";
    updateRecIndicatorInModal();
    // A recording row might be on-screen right now even on a different page
    // than the one being recorded is not possible to show a dot for (rows
    // only render for the currently open page) - only re-render the dot for
    // rows that belong to state.page.
    document.querySelectorAll(".row-rec-dot").forEach(function (el) { el.remove(); });
    Object.keys(recordings).forEach(function (id) {
      var rec = recordings[id];
      if (rec.page !== state.page) return;
      var row = document.querySelector('.row[data-key="' + CSS.escape(rec.group.key) + '"]');
      if (row && !row.querySelector(".row-rec-dot")) {
        var dot = document.createElement("span");
        dot.className = "rec-dot row-rec-dot" + (rec.confirmed ? "" : " is-pending");
        dot.title = rec.confirmed ? "מקליט" : "מתחיל הקלטה…";
        row.querySelector(".starbtn").insertAdjacentElement("afterend", dot);
      }
    });
    if (document.getElementById("recordings-overlay").classList.contains("is-open")) renderRecordingsPanel();
  }

  function renderRecordingsPanel() {
    var ids = Object.keys(recordings);
    document.getElementById("rec-panel-count").textContent = ids.length;
    var body = document.getElementById("rec-panel-body");
    if (!ids.length) {
      body.innerHTML = '<div class="panel-empty">אין הקלטות פעילות כרגע. פתחו ערוץ בנגן ולחצו רווח כדי להתחיל.</div>';
      return;
    }
    body.innerHTML = ids.map(function (id) {
      var rec = recordings[id];
      return (
        '<div class="rec-item" data-id="' + id + '">' +
          '<span class="rec-dot' + (rec.confirmed ? "" : " is-pending") + '" aria-hidden="true"></span>' +
          '<span class="ri-name">' + escapeHtml(rec.group.name) + " (" + PAGE_LABEL[rec.page] + ")</span>" +
          '<span class="ri-time mono" data-role="elapsed">' + (rec.confirmed ? elapsedLabel(rec.startedAt) : "מתחיל…") + "</span>" +
          '<button class="ri-stop">⏹ עצור</button>' +
        "</div>"
      );
    }).join("");
    body.querySelectorAll(".ri-stop").forEach(function (btn) {
      btn.addEventListener("click", function () {
        stopRecording(btn.closest(".rec-item").getAttribute("data-id"));
      });
    });
  }

  setInterval(function () {
    if (!activeRecordingCount()) return;
    updateRecIndicatorInModal();
    if (document.getElementById("recordings-overlay").classList.contains("is-open")) {
      document.querySelectorAll('[data-role="elapsed"]').forEach(function (el) {
        var rec = recordings[el.closest(".rec-item").getAttribute("data-id")];
        if (rec) el.textContent = elapsedLabel(rec.startedAt);
      });
    }
  }, 1000);

  document.getElementById("open-recordings").addEventListener("click", function () {
    renderRecordingsPanel();
    document.getElementById("recordings-overlay").classList.add("is-open");
  });
  document.getElementById("close-recordings").addEventListener("click", function () {
    document.getElementById("recordings-overlay").classList.remove("is-open");
  });
  document.getElementById("recordings-overlay").addEventListener("click", function (e) {
    if (e.target === document.getElementById("recordings-overlay")) {
      document.getElementById("recordings-overlay").classList.remove("is-open");
    }
  });

  // ---------- recording quality monitor ----------
  // Bandwidth contention from recording several channels at once shows up as
  // either the player stalling (buffer underrun, "waiting" events) or hls.js
  // stepping DOWN to a lower quality level. Either signal, seen recently
  // across the recordings actually running right now, is worth flagging -
  // a single recording having its own bad day isn't "too many recordings",
  // so this only fires with 2+ active.
  var QUALITY_WINDOW_MS = 30000;
  var QUALITY_STALL_THRESHOLD = 3;

  function checkQuality() {
    var ids = Object.keys(recordings);
    if (ids.length < 2) return;
    if (Date.now() - recBannerDismissedAt < 60000) return; // don't re-nag right after a dismiss
    var now = Date.now();
    var totalRecentStalls = 0;
    var degraded = [];
    ids.forEach(function (id) {
      var rec = recordings[id];
      rec.stalls = rec.stalls.filter(function (t) { return now - t < QUALITY_WINDOW_MS; });
      totalRecentStalls += rec.stalls.length;
      var recentDowngrade = rec.downgrades.length && now - rec.downgrades[rec.downgrades.length - 1].t < QUALITY_WINDOW_MS;
      if (rec.stalls.length || recentDowngrade) degraded.push(id);
    });
    if (totalRecentStalls >= QUALITY_STALL_THRESHOLD || degraded.length >= 2) {
      showQualityWarning(degraded.length ? degraded : ids);
    }
  }

  function showQualityWarning(candidateIds) {
    var names = candidateIds.map(function (id) { return recordings[id] ? recordings[id].group.name : null; }).filter(Boolean);
    recBanner.innerHTML =
      '<span>⚠ <strong>איכות השידור ירדה</strong> — כנראה עומס רוחב פס מהקלטת ' + activeRecordingCount() + ' ערוצים בו-זמנית. מומלץ להפסיק חלק מההקלטות.</span>' +
      '<span class="rb-actions">' +
      candidateIds.map(function (id) {
        var rec = recordings[id];
        return rec ? '<button data-stop="' + id + '">עצור: ' + escapeHtml(rec.group.name) + "</button>" : "";
      }).join("") +
      '<button class="rb-dismiss" id="rb-dismiss">התעלם</button>' +
      "</span>";
    recBanner.hidden = false;
    recBanner.querySelectorAll("[data-stop]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        stopRecording(btn.getAttribute("data-stop"));
        recBanner.hidden = true;
      });
    });
    document.getElementById("rb-dismiss").addEventListener("click", function () {
      recBanner.hidden = true;
      recBannerDismissedAt = Date.now();
    });
  }

  function updateBulkBar() {
    var n = state.selected.size;
    document.getElementById("bulk-count").textContent = n;
    document.getElementById("bulkbar").classList.toggle("is-visible", n > 0);
  }
  function updateSavedCount() {
    document.getElementById("saved-count").textContent = saved.tv.length + saved.radio.length;
  }

  document.getElementById("bulk-save").addEventListener("click", function () {
    state.selected.forEach(function (id) {
      var parts = id.split("::");
      var page = parts[0], key = parts.slice(1).join("::");
      if (saved[page].indexOf(key) === -1) saved[page].push(key);
    });
    lsSet(LS_SAVED, saved);
    updateSavedCount();
    state.selected.clear();
    renderList();
  });
  document.getElementById("bulk-clear").addEventListener("click", function () {
    state.selected.clear();
    renderList();
  });

  document.getElementById("search").addEventListener("input", function (e) {
    pageUi().search = e.target.value;
    lsSet(LS_UI, ui);
    renderList();
  });

  // ---------- saved panel ----------
  var overlay = document.getElementById("saved-overlay");
  document.getElementById("open-saved").addEventListener("click", function () {
    renderSavedPanel();
    overlay.classList.add("is-open");
  });
  document.getElementById("close-saved").addEventListener("click", closePanel);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closePanel(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePanel(); });
  function closePanel() { overlay.classList.remove("is-open"); }

  function savedEntries() {
    var out = [];
    ["tv", "radio"].forEach(function (page) {
      saved[page].forEach(function (key) {
        var g = PAGES[page].filter(function (gr) { return gr.key === key; })[0];
        if (g) out.push({ page: page, group: g });
      });
    });
    return out;
  }

  function renderSavedPanel() {
    var entries = savedEntries();
    document.getElementById("panel-count").textContent = entries.length;
    var body = document.getElementById("panel-body");
    if (!entries.length) {
      body.innerHTML = '<div class="panel-empty">עדיין לא שמרת ערוצים. לחצו על ☆ ליד ערוץ כדי לשמור אותו.</div>';
    } else {
      body.innerHTML = entries.map(function (e) {
        return (
          '<div class="panel-item" data-page="' + e.page + '" data-key="' + escapeHtml(e.group.key) + '">' +
            '<span class="pi-page">' + PAGE_LABEL[e.page] + "</span>" +
            '<span class="pi-name">' + escapeHtml(e.group.name) + "</span>" +
            '<button class="pi-remove" aria-label="הסר">✕</button>' +
          "</div>"
        );
      }).join("");
      Array.prototype.forEach.call(body.querySelectorAll(".pi-remove"), function (btn) {
        btn.addEventListener("click", function () {
          var item = btn.closest(".panel-item");
          var page = item.getAttribute("data-page"), key = item.getAttribute("data-key");
          var g = PAGES[page].filter(function (gr) { return gr.key === key; })[0];
          var prevPage = state.page;
          state.page = page;
          toggleSaved(g);
          state.page = prevPage;
          renderSavedPanel();
        });
      });
    }
    document.getElementById("export-json").disabled = !entries.length;
    document.getElementById("export-m3u").disabled = !entries.length;
  }

  // Artifacts run sandboxed: a plain <a download> click is silently
  // swallowed there, so saving a file has to go through the platform's own
  // window.claude.downloads capability (declared when this page is
  // published) - it shows the viewer a real save prompt instead. Falls back
  // to the old direct-click trick outside that context (e.g. opened as a
  // plain local file while developing this page).
  function downloadBlob(content, filename, mime) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: content }).catch(function (err) {
        var code = err && err.code;
        if (code === "declined") return; // the viewer said no - nothing more to do
        if (code === "rejected_extension") {
          // Only file types on the platform's own allowlist can be saved
          // (json/webm are; m3u isn't) - retry as .txt rather than fail
          // outright. Content is unchanged, just the extension.
          var txtName = filename.replace(/\.[^.]+$/, "") + ".txt";
          if (txtName !== filename) { downloadBlob(content, txtName, mime); return; }
        }
        var messages = {
          too_large: "הקובץ גדול מדי לשמירה (מעל 16MB) - נסו הקלטה קצרה יותר.",
          rejected_extension: "סוג הקובץ אינו נתמך לשמירה כאן.",
          rate_limited: "יש כבר בקשת שמירה פתוחה - נסו שוב בעוד רגע.",
        };
        alert(messages[code] || "שמירת הקובץ נכשלה" + (err && err.message ? ": " + err.message : "."));
      });
      return;
    }
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("export-json").addEventListener("click", function () {
    var list = savedEntries().map(function (e) {
      return { page: e.page, name: e.group.name, module: e.group.module, link: activeLinkFor(e.page, e.group) };
    });
    downloadBlob(JSON.stringify(list, null, 2), "idanplus-saved-channels.json", "application/json");
  });
  document.getElementById("export-m3u").addEventListener("click", function () {
    var lines = ["#EXTM3U"];
    savedEntries().forEach(function (e) {
      lines.push('#EXTINF:-1 group-title="' + PAGE_LABEL[e.page] + '",' + e.group.name);
      lines.push(activeLinkFor(e.page, e.group) || "");
    });
    downloadBlob(lines.join("\n"), "idanplus-saved-channels.m3u", "audio/x-mpegurl");
  });

  function activeLinkFor(page, group) {
    var prevPage = state.page;
    state.page = page;
    var link = activeLink(group);
    state.page = prevPage;
    return link;
  }

  function fullRender() {
    renderPageTabs();
    renderStats();
    renderFilters();
    renderList();
    updateSavedCount();
  }

  fullRender();
})();
</script>
