name: Deploy channel viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queuing behind it, since only the latest commit's output matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # web/channel_viewer.html is committed pre-built (see scripts/update_channels.py
      # + the build step documented in web/template.html) - this workflow doesn't
      # regenerate it, just publishes what's already in the repo. A copy named
      # index.html is added so the site's ROOT url shows the viewer directly,
      # without anyone needing to know the exact filename. og-image.png is
      # the WhatsApp/Facebook/Twitter link-preview image referenced by the
      # og:image meta tag in template.html - those crawlers fetch it as a
      # real HTTP request, so it has to be deployed as an actual file here,
      # not embedded in the HTML like the favicon is.
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp web/channel_viewer.html _site/index.html
          cp web/channel_viewer.html _site/channel_viewer.html
          cp web/og-image.png _site/og-image.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
